<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Grievance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-page">
        <div class="login-box">
            <div class="login-logo">🏛️</div>
            <h1>Staff & Admin Portal</h1>
            <p class="subtitle">AI Grievance Redressal System</p>

            {% if error %}
            <div class="alert-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Username / ID</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username"
                        required autofocus>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    🔓 Access Dashboard
                </button>
            </form>

            <div class="login-back" style="margin-top: 24px;">
                <a href="/">← Back to Public Portal</a>
            </div>
        </div>
    </div>

</body>

</html>
